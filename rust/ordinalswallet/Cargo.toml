[package]
name = "ordinalswallet"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Rust SDK for the Ordinals Wallet API (turbo.ordinalswallet.com)"
license = "MIT"
repository = "https://github.com/ordinals-wallet/ow-cli"
readme = "README.md"
keywords = ["bitcoin", "ordinals", "runes", "api", "sdk"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
publish = false

[lib]
name = "ordinalswallet"

[features]
default = []
# Key derivation, BIP-322 and PSBT verification/signing (rust-bitcoin 0.32 + libsecp256k1).
signing = ["dep:bitcoin"]

[dependencies]
# Blocking HTTP/1.1 client with rustls + webpki roots. No async runtime.
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
# Pins `url`'s IDNA back end to the ASCII-only adapter (the documented opt-out
# from ICU4X), removing ~25 transitive crates. Hostnames must be ASCII.
# CSPRNG for sign-in nonces; already in the tree via ring.
getrandom = { version = "=0.2.17", default-features = false }
idna_adapter = { version = "=1.0.0", default-features = false }
# `signing` only: transactions, PSBTs, BIP-32, sighashes, addresses and
# libsecp256k1. No rand/serde/base64/consensus features: entropy comes from
# getrandom (above) and is passed in explicitly.
bitcoin = { version = "=0.32.11", default-features = false, features = ["std"], optional = true }
